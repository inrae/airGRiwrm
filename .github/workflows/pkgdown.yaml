# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      # pkgdown mode: release on master, devel otherwise (dev branch, PRs
      # targeting a non-master ref, tags, workflow_dispatch). Note: on
      # pull_request events github.ref_name is the base (target) branch, so a
      # PR to master evaluates to release. GitHub Actions equivalent of the
      # former GitLab-CI line `test "$CI_COMMIT_BRANCH" -eq "master"`, with the
      # branch check via the github.ref_name context expression.
      PKGDOWN_DEV_MODE: ${{ github.ref_name == 'master' && 'release' || 'devel' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::remotes, local::.
          needs: website

      - name: Preprocess build site
        run: |
          sed -i 's/`function`/function/g' man/CreateRunOptions.Rd
          sed -i 's/`function`/function/g' man/CreateCalibOptions.Rd
          R -e 'remotes::install_gitlab("airgriwrm/seinebasin", host = "forge.inrae.fr")'

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, run_dont_run = TRUE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
